<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastrar carga</title>
  <link rel="icon" href="./icons/vacinado.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="./css/stylecsscargadash.css" />
</head>

<body onload="carregarVacinas(); carregarVeiculos();">
  <main class="container-principal-veiculos">
    <div class="nav-vertical">
      <h2 style="color: #fff; letter-spacing: 0.15rem;">VACCIN<span style="color: #153963;">TECH</span></h2>
      <ul>
        <li><a href="adicionar-rota.html"><i class="fas fa-solid fa-truck-fast"></i> Adicionar Rota</a> </li>
        <li><a href="cadastrar-vacina.html"><i class="fas fa-solid fa-syringe"></i> Cadastrar Vacina</a> </li>
        <li><a href="cadastrar-veiculo.html"><i class="fas fa-solid fa-car"></i> Cadastrar Veículo</a> </li>
        <li><a href="veiculos-em-rota.html"><i class="fas fa-solid fa-road"></i> Veículos em rota</a></li>
        <li><a href="../bobia/public/bobia.html"><i class="fas fa-solid fa-robot"></i>Solicitar IAssistente</a></li>
        <li><a href="jira.html"><i class="fas fa-solid fa-headset"></i>Jira</a></li>
        <li><a href="index.html"><i class="fas fa-solid fa-house"></i>Voltar</a></li>
      </ul>
    </div>
    <div class="container-veiculos">
      <h1 class="texto-veiculos"> NOVA ROTA</h1>
      <div class="container_cadastro">
        <div class="form_carga">

          <div class="campo">
            <label> <i class="fa-solid fa-syringe"></i> Vacina:</label>
            <select id="selecione-vacina" class="select-cadastro-vacina">
              <option value="">Selecione uma vacina</option>
            </select>
          </div>

          <div class="campo">
            <label><i class="fa-solid fa-truck"></i> Veículo:</label>
            <select id="selecione-veiculo" class="select-cadastro-vacina">
              <option value="">Selecione um veículo</option>
            </select>
          </div>

          <div class="campo">
            <label><i class="fa-solid fa-capsules"></i> Quantidade de Vacinas:</label>
            <input type="number" id="ipt_qtd_vacina" placeholder="Ex: 500">
          </div>

          <div class="campo">
            <label><i class="fa-solid fa-location-dot"></i> Origem:</label>
            <input type="text" id="ipt_origem" placeholder="Ex: São Paulo">
          </div>

          <div class="campo">
            <label><i class="fa-solid fa-flag-checkered"></i> Destino:</label>
            <input type="text" id="ipt_destino" placeholder="Ex: Campinas">
          </div>

          <button class="btn_adicionar" onclick="cadastrarCarga()">
            Adicionar Carga
          </button>
        </div>
      </div>
    </div>
  </main>
</body>

</html>
<script>
  function cadastrarCarga() {
    let vacinaVar = document.getElementById("selecione-vacina").value;
    let veiculoVar = document.getElementById("selecione-veiculo").value;
    let qtdVacinaVar = document.getElementById("ipt_qtd_vacina").value;
    let origemVar = document.getElementById("ipt_origem").value;
    let destinoVar = document.getElementById("ipt_destino").value;
    let idUsuario = sessionStorage.ID_USUARIO;

    if (vacinaVar == '' || veiculoVar == '' || qtdVacinaVar == '' || origemVar == '' || destinoVar == '') {
      alert("Preencha todos os campos para prosseguir!");
      return;
    }

    fetch("/viagens/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        vacina: vacinaVar,
        veiculo: veiculoVar,
        qtdVacina: qtdVacinaVar,
        origem: origemVar,
        destino: destinoVar,
        userId: idUsuario
      })
    }).then(function (resposta) {

      if (resposta.ok) {
        alert("Carga cadastrada com sucesso!");
        document.getElementById("selecione-vacina").value = '';
        document.getElementById("selecione-veiculo").value = '';
        document.getElementById("ipt_qtd_vacina").value = '';
        document.getElementById("ipt_origem").value = '';
        document.getElementById("ipt_destino").value = '';

        setTimeout(function () {
          window.location.href = "veiculos-em-rota.html";
        }, 2000);
      } else {
        alert("Erro ao cadastrar carga. Tente novamente.");
      }
    }).catch(function (error) {
      console.error("Erro na requisição:", error);
      alert("Erro na comunicação com o servidor. Tente novamente.");
    });
  }

  function carregarVacinas() {
    fetch("/vacinas/listar")
      .then(function (resposta) {
        if (resposta.ok) {
          return resposta.json().then(function (dados) {
            const selectVacina = document.getElementById("selecione-vacina");
            let options = '<option value="">Selecione uma vacina</option>';
            for (let i = 0; i < dados.length; i++) {
              const vacina = dados[i];
              options += `<option value="${vacina.idVacina}">${vacina.nome}</option>`;
            }
            selectVacina.innerHTML = options;
          });
        } else {
          console.error("Erro ao carregar vacinas:", resposta.statusText);
        }
      })

      .catch(function (error) { console.error("Erro na requisição:", error); });
  }

  function carregarVeiculos() {
    fetch("/transportes/listar")
      .then(function (resposta) {
        if (resposta.ok) {
          return resposta.json().then(function (dados) {
            const selectVeiculo = document.getElementById("selecione-veiculo");
            let options = '<option value="">Selecione um veículo</option>';
            for (let i = 0; i < dados.length; i++) {
              const veiculo = dados[i];
              options += `<option value="${veiculo.idTransporte}">${veiculo.placa} - ${veiculo.modelo}</option>`;
            }
            selectVeiculo.innerHTML = options;
          })
        } else {
          console.error("Erro ao carregar veículos: ", resposta.statusText);
        }
      })
      .catch(function (error) {
        console.error("Erro ao carregar veículos:", error);
      });
  }
</script>
