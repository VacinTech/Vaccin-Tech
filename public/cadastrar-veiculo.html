<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastrar Veículo</title>
  <link rel="icon" href="./icons/vacinado.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="./css/stylecsscargadash.css" />
</head>

<body onload="carregarEmpresas()">
  <main class="container-principal-veiculos">
     <div class="nav-vertical">
            <h2 style="color: #fff; letter-spacing: 0.15rem;">VACCIN<span style="color: #153963;">TECH</span></h2>
            <ul>
                <li><a href="adicionar-rota.html"><i class="fas fa-solid fa-truck-fast"></i> Adicionar Rota</a> </li>
                <li><a href="cadastrar-vacina.html"><i class="fas fa-solid fa-syringe"></i> Cadastrar Vacina</a> </li>
                <li><a href="cadastrar-veiculo.html"><i class="fas fa-solid fa-car"></i> Cadastrar Veículo</a> </li>
                <li><a href="veiculos-em-rota.html"><i class="fas fa-solid fa-road"></i> Veículos em rota</a></li>
                <li><a href="./bobia/bobia.html"><i class="fas fa-solid fa-robot"></i>Solicitar IAssistente</a></li>
                <li><a href="https://vaccintechhelp.atlassian.net/servicedesk/customer/portal/2" target="_blank"><i class="fas fa-solid fa-headset"></i>Jira</a></li>
                <li><a href="index.html"><i class="fas fa-solid fa-house"></i>Voltar</a></li>
            </ul>
        </div>
    <div class="container-veiculos">
      <h1 class="texto-veiculos"> NOVO VEÍCULO</h1>
      <div class="container_cadastro">
        <div class="form_carga">

          <div class="campo">
            <label> <i class="fa-solid fa-circle-info"></i> Placa do veículo</label>
            <input type="text" id="ipt_placa" placeholder="Ex: ABC-1234">
          </div>

          <div class="campo">
            <label><i class="fa-solid fa-truck"></i> Modelo</label>
            <input type="text" id="ipt_modelo" placeholder="Ex: Fiat Ducato">
          </div>

          <div class="campo">
            <label><i class="fa-solid fa-capsules"></i> Tipo de refrigeramento</label>
            <input type="text" id="ipt_tipo_refrigeramento" placeholder="Ex: Refrigeração ativa">
          </div>

         <div class="campo">
            <label><i class="fa-solid fa-truck"></i> Escolha a empresa</label>
            <select id="selecione-empresa" class="select-cadastro-vacina">
              <option value="">Selecione uma empresa</option>
            </select>
          </div>

          <button class="btn_adicionar" onclick="cadastrarVeiculo()">
            Adicionar Veículo
          </button>

        </div>

      </div>


    </div>
  </main>
</body>

</html>
<script>
  function cadastrarVeiculo() {
    let placaVar = ipt_placa.value;
    let modeloVar = ipt_modelo.value;
    let tipoRefrigeramentoVar = ipt_tipo_refrigeramento.value;
    let empresaIdVar = document.getElementById("selecione-empresa").value;
    let idUser = sessionStorage.ID_USUARIO;

    if (placaVar == '' || modeloVar == '' || tipoRefrigeramentoVar == '' || empresaIdVar == '') {
      alert("Preencha todos os campos para prosseguir!");
      return;
    }

    fetch("/transportes/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        placa: placaVar,
        modelo: modeloVar,
        tipoRefrigeramento: tipoRefrigeramentoVar,
        empresaId: empresaIdVar,
        userId: idUser
      })
    }).then(function (resposta) {

      if (resposta.ok) {
        alert("Veículo cadastrado com sucesso!");
        window.location.href = "adicionar-rota.html";
      } else {
        alert("Erro ao cadastrar veículo. Verifique os dados e tente novamente.");
      }
    }).catch(function (error) {
      console.error("Erro na requisição:", error);
      alert("Ocorreu um erro ao cadastrar o veículo. Por favor, tente novamente mais tarde.");
    });
  }

  function carregarEmpresas() {
    fetch("/empresas/listar")
      .then(function (resposta) {
        if (resposta.ok) {
            resposta.json().then(function (dados) {
                const selectEmpresa = document.getElementById("selecione-empresa");
                let options = '<option value="">Selecione uma empresa</option>';
                for (let i = 0; i < dados.length; i++) {
                    const empresa = dados[i];
                    options += `<option value="${empresa.idEmpresa}">${empresa.razaoSocial}</option>`;
                }
                selectEmpresa.innerHTML = options;
            });
        } else {
            console.error("Erro ao carregar empresas:", resposta.statusText);
        }
    }).catch(function (error) {
        console.error("Erro na requisição:", error);
    });
  }
</script>
