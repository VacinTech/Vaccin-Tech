  <main class="container-principal-veiculos">
     <div class="nav-vertical">
            <h2 style="color: #fff; letter-spacing: 0.15rem;">VACCIN<span style="color: #153963;">TECH</span></h2>

    <div class="container-veiculos">
      <h1 class="texto-veiculos"> NOVA VACINA</h1>
      <div class="container_cadastro">
        <div class="form_carga">

          <div class="campo">
            <label> <i class="fa-solid fa-syringe"></i> Nome da Vacina</label>
            <input type="text" placeholder="Ex: CoronaVac">
          </div>

          <div class="campo">
            <label><i class="fa-solid fa-truck"></i> Fabricante</label>
            <input type="text" placeholder="Ex: Butantan">
          </div>

          <div class="campo">
            <label><i class="fa-solid fa-capsules"></i> Lote</label>
            <input type="text" placeholder="Ex: 4120Z001">
          </div>

          <div>
            <label style="color: #fff; font-weight: 600;"> <i class="fa-solid fa-temperature-half"></i> Temperatura
              Permitida</label>

            <div class="temperatura">
              <div class="campo">
                <input type="number" placeholder="Mín">
              </div>

              <div class="campo">
                <input type="number" placeholder="Máx">
              </div>

            </div>
          </div>

          <button class="btn_adicionar">
            Adicionar Vacina
          </button>

        </div>

      </div>
