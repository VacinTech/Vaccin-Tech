<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastrar carga</title>
  <link rel="icon" href="./icons/vacinado.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="./css/stylecsscargadash.css" />
</head>

<body>
  <main class="container-principal-veiculos">
     <div class="nav-vertical">
            <h2 style="color: #fff; letter-spacing: 0.15rem;">VACCIN<span style="color: #153963;">TECH</span></h2>
            <ul>
                <li><a href="cadastrar-carga.html"><i class="fas fa-solid fa-truck-fast"></i> Adicionar Rota</a> </li>
                <li><a href="cadastrar-vacina.html"><i class="fas fa-solid fa-syringe"></i> Cadastrar Vacina</a> </li>
                <li><a href="cadastrar-veiculo.html"><i class="fas fa-solid fa-truck"></i> Cadastrar Veículo</a> </li>
                <li><a href="veiculo-em-rota.html"><i class="fas fa-solid fa-road"></i> Veículos em rota</a></li>
                <li><a href="index.html"><i class="fas fa-solid fa-house"></i>Voltar</a></li>
            </ul>
        </div>
    <div class="container-veiculos">
      <h1 class="texto-veiculos"> NOVA ROTA</h1>
      <div class="container_cadastro">
        <div class="form_carga">

          <div class="campo">
            <label> <i class="fa-solid fa-syringe"></i> Nome da Vacina</label>
            <select id="selecione-vacina">
              <option value="">Selecione uma vacina</option>
            </select>
          </div>

          <div class="campo">
            <label><i class="fa-solid fa-truck"></i> Placa do Veículo</label>
            <select id="selecione-veiculo">
              <option value="">Selecione um veículo</option>
            </select>
          </div>

          <div class="campo">
            <label><i class="fa-solid fa-capsules"></i> Quantidade de Vacinas</label>
            <input type="number" id="ipt_qtd_vacina" placeholder="Ex: 500">
          </div>

          <div class="campo">
            <label><i class="fa-solid fa-location-dot"></i> Origem</label>
            <input type="text" id="ipt_origem" placeholder="Ex: São Paulo">
          </div>

          <div class="campo">
            <label><i class="fa-solid fa-flag-checkered"></i> Destino</label>
            <input type="text" id="ipt_destino" placeholder="Ex: Campinas">
          </div>

          <button class="btn_adicionar" onclick="cadastrarCarga()">
            Adicionar Carga
          </button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
