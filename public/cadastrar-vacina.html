<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastrar Vacina</title>
  <link rel="icon" href="./icons/vacinado.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="./css/stylecsscargadash.css" />
</head>

<body>
  <main class="container-principal-veiculos">
     <div class="nav-vertical">
            <h2 style="color: #fff; letter-spacing: 0.15rem;">VACCIN<span style="color: #153963;">TECH</span></h2>
             <ul>
                <li><a href="adicionar-rota.html"><i class="fas fa-solid fa-truck-fast"></i> Adicionar Rota</a> </li>
                <li><a href="cadastrar-vacina.html"><i class="fas fa-solid fa-syringe"></i> Cadastrar Vacina</a> </li>
                <li><a href="cadastrar-veiculo.html"><i class="fas fa-solid fa-car"></i> Cadastrar Veículo</a> </li>
                <li><a href="veiculos-em-rota.html"><i class="fas fa-solid fa-road"></i> Veículos em rota</a></li>
                <li><a href="../bobia/bobia.html"><i class="fas fa-solid fa-robot"></i>Solicitar IAssistente</a></li>
                <li><a href="jira.html"><i class="fas fa-solid fa-headset"></i>Jira</a></li>
                <li><a href="index.html"><i class="fas fa-solid fa-house"></i>Voltar</a></li>
            </ul>
        </div>
    <div class="container-veiculos">
      <h1 class="texto-veiculos"> NOVA VACINA</h1>
      <div class="container_cadastro">
        <div class="form_carga">

          <div class="campo">
            <label> <i class="fa-solid fa-syringe"></i> Nome da Vacina:</label>
            <input type="text" id="ipt_nome_vacina" placeholder="Ex: CoronaVac">
          </div>

          <div class="campo">
            <label><i class="fa-solid fa-syringe"></i> Fabricante:</label>
            <input type="text" id="ipt_fabricante" placeholder="Ex: Butantan">
          </div>

          <div class="campo">
            <label><i class="fa-solid fa-capsules"></i> Lote:</label>
            <input type="text" id="ipt_lote" placeholder="Ex: 4120Z001">
          </div>

          <div class="campo">
            <label><i class="fa-solid fa-capsules"></i> Data de validade:</label>
            <input type="text" id="ipt_data_validade" placeholder="Ex: 2026-12-31">
          </div>

          <div class="campo">
            <label><i class="fa-solid fa-capsules"></i> Data de fabricação:</label>
            <input type="text" id="ipt_data_fabricacao" placeholder="Ex: 2026-06-05">
          </div>


          <div>
            <label style="color: #fff; font-weight: 600;"> <i class="fa-solid fa-temperature-half"></i> Temperatura
              Permitida:</label>

            <div class="temperatura">
              <div class="campo">
                <input type="number" id="ipt_temp_min" placeholder="Mín">
              </div>

              <div class="campo">
                <input type="number" id="ipt_temp_max" placeholder="Máx">
              </div>

            </div>
          </div>

          <button class="btn_adicionar" onclick="cadastrarVacina()">
            Adicionar Vacina
          </button>

        </div>

      </div>


    </div>
  </main>
</body>

</html>

<script>
  function cadastrarVacina() {
    let nomeVacina = ipt_nome_vacina.value;
    let fabricante = ipt_fabricante.value;
    let lote = ipt_lote.value;
    let tempMin = ipt_temp_min.value;
    let tempMax = ipt_temp_max.value;
    let dataValidade = ipt_data_validade.value;
    let dataFabricacao = ipt_data_fabricacao.value;
    let idUsuario = sessionStorage.ID_USUARIO;

    if (nomeVacina == '' || fabricante == '' || lote == '' || tempMin == '' || tempMax == '' || dataValidade == '' || dataFabricacao == '') {
      alert("Preencha todos os campos para prosseguir!");
      return;
    }

    fetch("/vacinas/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        nomeVacinaServer: nomeVacina,
        fabricanteServer: fabricante,
        loteServer: lote,
        tempMinServer: tempMin,
        tempMaxServer: tempMax,
        dataValidadeServer: dataValidade,
        dataFabricacaoServer: dataFabricacao,
        userId: idUsuario
      })
    }).then(function (resposta) {

      if (resposta.ok) {
        alert("Vacina cadastrada com sucesso!");
        console.log(resposta);
        setTimeout(function () {
          window.location.href = "adicionar-rota.html";
        }, 2000);
      } else {
        alert("Houve um erro ao cadastrar a vacina!");
        console.log(resposta);
      }

    }).catch(function (erro) {
      alert("Houve um erro ao tentar cadastrar a vacina!");
      console.log(erro);
    });
  }
</script>
