<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styleCL.css">
    <link rel="icon" href="./icons/vacinado.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <title>Cadastro VaccinTech</title>
</head>

<body>
    <main class="container">
        <section class="conteudo">
            <section class="primeira_cosluna">
                <a href="index.html">
                    <i class="fa-solid fa-arrow-left seta-login-cadastro" style="color: white;"></i>
                </a>
                <h1 class="titulo">Bem-vindo à VaccinTech!</h1>
                <p class="paragrafo paragrafo_coluna1">Para manter contato conosco</p>
                <p class="paragrafo paragrafo_coluna1">Por favor, faça login com suas informações pessoais</p>
                <button class="btn btn_coluna1"><a href="login.html">ENTRAR</a></button>
            </section>
            <section class="segunda_coluna">
                <h1 class="titulo coluna_2">Criar Conta</h1>
                <p class="paragrafo">Utilize seus dados pessoais para registrar-se</p>
                <form class="formulario">
                    <input type="text" id="input_nome" placeholder="Nome:" required>
                    <input type="email" id="input_email" oninput="validarEmail()" onfocus="mostrarEmail()"
                        placeholder="Email:" required>
                    <input type="text" id="input_senha" oninput="validarSenha()" onfocus="validarSenha()"
                        placeholder="Senha:" required>
                    <input type="password" id="input_confirmar" oninput="confirmarSenha()"
                        placeholder="Confirme a sua senha" placeholder="Confirme a sua senha" required>

                    <select id="selecione-empresa" class="select-cadastro-empresa">
                        <option value="">Selecione uma empresa</option>
                        <option value="empresaA">Empresa A</option>
                        <option value="empresaB">Empresa B</option>
                        <option value="empresaC">Empresa C</option>
                    </select>
                </form>
                <div class="paragrafo" id="div_msg"></div>
                <button onclick="cadastrar()" class="btn btn_coluna2">CRIAR CONTA</button>
            </section>
        </section>
    </main>
</body>

</html>
<script>
    let validacaoEmail = false;
    let validacaoSenha = false;
    let validacaoConfirmacao = false;
    function validarEmail() {
        let email = input_email.value;
        // let termina_com = email;
        let mensagem = "";
        if (email.endsWith(".com") || email.endsWith(".com.br")) {
            validacaoEmail = true;

            mensagem += `<span style='color:green'>✔ E-mail com extensões de domínio</span><br>`;
        } else {
            mensagem += `<span style='color:gray'>❌ E-mail deve conter TLD e ccTLD</span><br>`;
        }

        let temArroba = email.includes("@");

        if (temArroba) {
            mensagem += `<span style='color:green'>✔ Possui @</span><br>`;
        } else {
            mensagem += `<span style='color:gray'>❌ Não possui @</span><br>`;
        }
        div_msg.innerHTML = mensagem;
    }
    function mostrarEmail() {
        div_msg.innerHTML = "";
    }

    function validarSenha() {
        mostrarSenha();
        let mensagem = "";
        let senha = input_senha.value;


        if (senha.length >= 8) {
            validacaoSenha = true;
            mensagem += `<span style='color:green'>✔ 8 Caracteres </span><br>`;
        } else {
            mensagem += `<span style="color: gray;">❌ Mínimo 8 caracteres</span><br>`;
        }

        if (senha != senha.toLowerCase()) {
            mensagem += `<span style='color:green'>✔ Possui letra maiúscula</span><br>`;
        } else {
            mensagem += `<span style="color: gray;">❌ Não possui letra maiúscula</span><br>`;
        }

        let temEspecial =
            senha.includes("!") ||
            senha.includes("_") ||
            senha.includes("@") ||
            senha.includes("#") ||
            senha.includes("$") ||
            senha.includes("%") ||
            senha.includes("&") ||
            senha.includes("*");
        if (temEspecial) {
            mensagem += `<span style='color:green'>✔ Possui caracter especial</span><br>`;
        } else {
            mensagem += `<span style="color: gray;">❌ Não possui caracter especial</span><br>`;
        }

        let temNumero =
            senha.includes("0") ||
            senha.includes("1") ||
            senha.includes("2") ||
            senha.includes("3") ||
            senha.includes("4") ||
            senha.includes("5") ||
            senha.includes("6") ||
            senha.includes("7") ||
            senha.includes("8") ||
            senha.includes("9");

        if (temNumero) {
            mensagem += `<span style='color:green'>✔ Possui número</span><br>`;
        } else {
            mensagem += `<span style="color: gray;">❌ Não possui número</span><br>`;
        }
        div_msg.innerHTML = mensagem;

        function mostrarSenha() {
            div_msg.innerHTML = "";
        }
    }

    function confirmarSenha() {
        let senha = input_senha.value;
        let confirmar = input_confirmar.value;
        let senhaconfirmada = confirmar;

        if (senha === senhaconfirmada) {
            validacaoConfirmacao = true;
        } else {
            validacaoConfirmacao = false;

        }

    }

    function cadastrar() {
        let msg = '';
        let nomeVar = input_nome.value;
        let emailVar = input_email.value;
        let senhaVar = input_senha.value;
        let confVar = input_confirmar.value;


        // Verificação de campos em branco
        if (nomeVar == '' || emailVar == '' || senhaVar == '' || confVar == '') {
            div_msg.innerHTML = `<span style="color: red;">Preencha os campos vazios</span>`;
            return false;
        }

        // Bloqueia o envio se as regras visuais de validação falharem
        if (!validacaoEmail || !validacaoSenha || !validacaoConfirmacao) {
            div_msg.innerHTML = `<span style="color: red;">Por favor, atenda a todos os critérios de validação antes de prosseguir.</span>`;
            return false;
        }

        fetch("usuarios/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                nomeServer: nomeVar,
                emailServer: emailVar,
                senhaServer: senhaVar,
            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {
                    div_msg.innerHTML = `<span style="color: green;">Cadastro realizado com sucesso! Redirecionando para tela de Login...</span>`;

                    setTimeout(() => {
                        window.location = "login.html";
                    }, 2000);

                } else {
                    throw new Error("Houve um erro ao tentar realizar o cadastro!");
                }
            })
            .catch(function (erro) {
                console.log(`#ERRO: ${erro}`);
                div_msg.innerHTML = `<span style="color: red;">Erro no servidor ao tentar cadastrar.</span>`;
            });

        return false;
    }
</script>
