<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/stylecsscargadash.css" />
    <link rel="icon" href="./icons/vacinado.png" />
    <title>Veiculos em rota</title>
  </head>

  <body onload="atualizarFeed()">
    <main class="container-principal-veiculos">
      <div class="nav-vertical">
        <h2 style="color: #fff; letter-spacing: 0.15rem">
          VACCIN<span style="color: #153963">TECH</span>
        </h2>
        <ul>
          <li>
            <a href="adicionar-rota.html"
              ><i class="fas fa-solid fa-truck-fast"></i> Adicionar Rota</a
            >
          </li>
          <li>
            <a href="cadastrar-vacina.html"
              ><i class="fas fa-solid fa-syringe"></i> Cadastrar Vacina</a
            >
          </li>
          <li>
            <a href="cadastrar-veiculo.html"
              ><i class="fas fa-solid fa-car"></i> Cadastrar Veiculo</a
            >
          </li>
          <li>
            <a href="veiculos-em-rota.html"
              ><i class="fas fa-solid fa-road"></i> Veículos em rota</a
            >
          </li>
          <li>
            <a href="index.html"><i class="fas fa-solid fa-house"></i>Voltar</a>
          </li>
        </ul>
      </div>
      <div id="container-veiculos">
        <h1 class="texto-veiculos">VEÍCULOS EM ROTA</h1>
        <div class="container-caixas-veiculos">
          <!-- As caixas de veículos serão inseridas aqui dinamicamente -->
        </div>
      </div>
    </main>
  </body>
</html>
<script>
  function atualizarFeed() {
    // let idEmpresa = sessionStorage.ID_EMPRESA;
    // let idEmpresa = 1;

    fetch(`/viagens/buscarRotasPorEmpresa/${sessionStorage.EMPRESA_USUARIO}`)
      .then(function (resposta) {
        if (resposta.ok) {
          if (resposta.status == 204) {
            let feed = document.querySelector(".container-caixas-veiculos");
            feed.innerHTML = "Nenhum resultado encontrado.";
            throw "Nenhum resultado encontrado!";
          }

          resposta.json().then(function (resposta) {
            console.log("Dados recebidos: ", JSON.stringify(resposta));

            let feed = document.querySelector(".container-caixas-veiculos");
            feed.innerHTML = "";

            for (let i = 0; i < resposta.length; i++) {
              let rota = resposta[i];

              let corTemperatura = "green";

              if (
                rota.temperaturaAtual < rota.temperaturaMin ||
                rota.temperaturaAtual > rota.temperaturaMax
              ) {
                corTemperatura = "red";
              } else if (
                rota.temperaturaAtual == rota.temperaturaMin ||
                rota.temperaturaAtual == rota.temperaturaMax
              ) {
                corTemperatura = "yellow";
              }
              feed.innerHTML += `
                  <div class="caixa-veiculo">
                    <p class="texto-rota">
                      ${rota.origem} ➔ ${rota.destino}
                    </p>
                
                    <div class="info-caixa">
                      <p class="texto-graus">
                        ${rota.temperaturaAtual}°C
                      </p>
                  
                      <div class="circulo-id" style="background-color: ${corTemperatura}">
                        ${rota.placa}
                      </div>
                    </div>
                
                    <a href="detalhes-veiculos.html" class="link-ver-mais">
                      Ver mais detalhes..
                    </a>
                  </div>
                `;
            }
          });
        } else {
          throw "Houve um erro na API!";
        }
      })
      .catch(function (erro) {
        console.error(erro);
      });
  }
</script>
