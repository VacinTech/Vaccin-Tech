      <h1 class="texto-veiculos">VEÍCULOS EM ROTA</h1>

</html>
<script>
  function abrirDetalhes(idViagem, idSensor) {
    sessionStorage.ID_VIAGEM = idViagem;
    sessionStorage.ID_SENSOR = idSensor;
  }

  function atualizarFeed() {
    let idEmpresa = sessionStorage.ID_EMPRESA;
    // let idEmpresa = 1;

    fetch(`/viagens/buscarRotasPorEmpresa/${sessionStorage.EMPRESA_USUARIO}`)
      .then(function (resposta) {
        if (resposta.ok) {
          if (resposta.status == 204) {
            let feed = document.querySelector(".container-caixas-veiculos");
            feed.innerHTML = "Nenhum resultado encontrado.";
            throw "Nenhum resultado encontrado!";
          }

          resposta.json().then(function (resposta) {
            console.log("Dados recebidos: ", JSON.stringify(resposta));

            let feed = document.querySelector(".container-caixas-veiculos");
            feed.innerHTML = "";

            for (let i = 0; i < resposta.length; i++) {
              let rota = resposta[i];

              let corTemperatura = "green";

              if (
                rota.temperaturaAtual < rota.temperaturaMin ||
                rota.temperaturaAtual > rota.temperaturaMax
              ) {
                corTemperatura = "red";
              } else if (
                rota.temperaturaAtual == rota.temperaturaMin ||
                rota.temperaturaAtual == rota.temperaturaMax
              ) {
                corTemperatura = "yellow";
              }
              feed.innerHTML += `
                  <div class="caixa-veiculo">
                    <p class="texto-rota">
                      ${rota.origem} ➔ ${rota.destino}
                    </p>
                
                    <div class="info-caixa">
                      <p class="texto-graus">
                        ${rota.temperaturaAtual}°C
                      </p>
                  
                      <div class="circulo-id" style="background-color: ${corTemperatura}">
                        ${rota.placa}
                      </div>
                    </div>
                <div class="vermais-btn">
                    <a
                      href="detalhes-veiculos.html"
                      class="link-ver-mais"
                      onclick="abrirDetalhes(${rota.idViagem}, ${rota.idSensor})"
                    >
                      Ver mais detalhes..
                    </a>
                    <button
                      class="btn-concluir"
                      onclick="concluirRota(${rota.idViagem})"
                    >
                      Concluir rota
                    </button>
                  </div>
                </div>
                `;
            }
            setTimeout(atualizarFeed, 2000);
          });
        } else {
          throw "Houve um erro na API!";
        }
      })
      .catch(function (erro) {
        console.error(erro);
        setTimeout(atualizarFeed, 2000);
      });
  }

  function concluirRota(idViagem) {
    const confirmar = confirm(
      "Tem certeza que deseja concluir esta rota?"
    );

    if (!confirmar) {
      return;
    }

    fetch(`/viagens/concluirRota/${idViagem}`, {
      method: "PUT",
    })
      .then((resposta) => {
        if (resposta.ok) {
          alert("Rota concluída com sucesso!");
          atualizarFeed();
        } else {
          alert("Erro ao concluir rota.");
        }
      })
      .catch((erro) => {
        console.error(erro);
      });
  }
</script>
